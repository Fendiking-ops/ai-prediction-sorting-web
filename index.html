<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valence AI Predictions - Free Gateway</title>
    <style>
        body { background: #0b0f19; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
        .hero-banner { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); border-bottom: 2px solid #334155; padding: 30px 20px; text-align: center; }
        h1 { color: #38bdf8; font-size: 26px; margin: 0 0 10px 0; }
        p { color: #94a3b8; font-size: 14px; max-width: 500px; margin: 0 auto 20px auto; line-height: 1.5; }
        .sub-box { background: #0f172a; padding: 20px; border-radius: 10px; border: 1px solid #475569; max-width: 400px; margin: 0 auto; box-sizing: border-box; }
        input[type="email"] { width: 100%; box-sizing: border-box; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #1e293b; color: #fff; margin-bottom: 12px; font-size: 14px; }
        button { width: 100%; background: #16a34a; color: #ffffff; border: none; padding: 12px; font-weight: 700; border-radius: 6px; cursor: pointer; font-size: 15px; }
        button:hover { background: #15803d; }
        #sub-status-msg { font-size: 12px; color: #94a3b8; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="hero-banner">
        <h1>Valence AI Predictions</h1>
        <p>Explore our free public preview. To unlock full Tier-1 sharp picks, Bayesian yield metrics, and automated match logs, subscribe below.</p>
        
        <div class="sub-box">
            <h3 style="color: #38bdf8; margin-top: 0; font-size: 16px;">Valence AI Elite Access</h3>
            <p style="font-size: 13px; color: #cbd5e1; margin-bottom: 15px;">₦10,000 / month (Auto-renewing)</p>
            <input type="email" id="subscriber-email" placeholder="Enter your email address" required>
            <button onclick="initiatePaystackSubscription()">Subscribe Now</button>
            <p id="sub-status-msg"></p>
        </div>
    </div>

    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script>
        function initiatePaystackSubscription() {
            const emailInput = document.getElementById('subscriber-email').value.trim();
            const statusMsg = document.getElementById('sub-status-msg');
            if (!emailInput || !emailInput.includes('@')) {
                statusMsg.style.color = '#f87171';
                statusMsg.textContent = 'Please enter a valid email address.';
                return;
            }
            statusMsg.style.color = '#38bdf8';
            statusMsg.textContent = 'Opening secure Paystack checkout...';
            
            const handler = PaystackPop.setup({
                key: 'pk_live_3b5aff686eaff612d0e6315804bb7679c6a2b6ed',
                email: emailInput,
                amount: 1000000,
                currency: 'NGN',
                plan: 'PLN_yhk5z4rnocx4yjk',
                ref: 'VAL_' + Math.floor((Math.random() * 1000000000) + 1),
                callback: function(response) {
                    statusMsg.style.color = '#4ade80';
                    statusMsg.textContent = 'Payment verified! Redirecting to paid platform...';
                    localStorage.setItem('valence_subscriber_email', emailInput);
                    localStorage.setItem('valence_subscription_active', 'true');
                    setTimeout(() => {
                        window.location.href = 'https://fendiking-ops.github.io/ai-prediction-admin-web/';
                    }, 1500);
                },
                onClose: function() {
                    statusMsg.style.color = '#94a3b8';
                    statusMsg.textContent = 'Checkout closed. Click Subscribe whenever you are ready.';
                }
            });
            handler.openIframe();
        }
    </script>
</body>
</html>
